syntax = "proto3";

package connection;

option go_package = "generated/proto";

enum ConnectionStatus {
    UNKNOWN = 0;
    ACCEPTED = 1;
    DENIED = 2;
}

message ConnectionRequest {
    string Password = 1;
}

message ConnectionResponse {
    ConnectionStatus status = 1;
}

service Connections {
    rpc Connect(ConnectionRequest) returns (ConnectionResponse) {}
}